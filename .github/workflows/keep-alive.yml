name: Keep the API awake

# Render's free plan puts the API to sleep after 15 idle minutes, and the first request after that waits 30-60 s
# ("server is waking up"). A ping every 10 minutes keeps it awake; the free 750 hours a month cover one service for the
# whole month. GitHub may start a scheduled run a few minutes late, which still lands inside the 15 minutes most of
# the time, and stops scheduled runs after 60 days without a commit to the repository.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The health endpoint touches no database rows; retries ride out a wake-up already in progress
      - run: curl --fail --silent --show-error --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 https://liftlog-api-evn4.onrender.com/api/v1/health
